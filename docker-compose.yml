# WorkBuddy credits dashboard - one-click container startup
#
# Usage:
#   docker compose up -d        -> open http://127.0.0.1:8080
#   docker compose logs -f      -> follow logs
#   docker compose down         -> stop (data stays on host)
#
# Scheme: WB_COLLECTOR=file (WebDAV sync). The project dir is bind-mounted to /app,
# so the container and the desktop (Edge) scheme share the SAME data set
# (wb-accounts.json / wb-sync.json / credits.db) - no migration needed.
services:
  credits:
    build: .
    image: wb-credits:latest
    container_name: wb-credits
    ports:
      - "8080:8080"
    environment:
      WB_COLLECTOR: file
      TZ: Asia/Shanghai   # 容器默认 UTC;设置中国时区,配合 derive 固定 +8 口径,自然日不再错位
    volumes:
      - .:/app
    restart: unless-stopped
